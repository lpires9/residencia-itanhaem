<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acervo — Acervo Itanhaém</title>
<meta name="description" content="Resumos de artigos e questões da residência do Hospital Regional de Itanhaém Jorge Rossmann.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="masthead-title" href="index.html">
      <img class="masthead-logo" src="assets/logo.svg" alt="Emblema HRJR" width="40" height="40">
      <span class="masthead-text">
        <span class="masthead-kicker">Hospital Regional de Itanhaém · Jorge Rossmann</span>
        <span class="masthead-name">Acervo Itanhaém</span>
      </span>
    </a>
    <nav class="masthead-nav">
      <a href="acervo.html" class="is-active">Acervo</a>
      <a href="index.html#equipe">Equipe</a>
      <a href="index.html#sobre">Sobre</a>
    </nav>
  </div>
</header>

<main>
  <section class="section-head">
    <h1>Acervo de artigos</h1>
    <p class="section-note">Resumos feitos pelos próprios residentes, cada um com cinco questões para revisão.</p>
  </section>

  <section class="archive">
    <ul class="team-list acervo-list" id="lista-acervo">
      <li class="team-row"><span class="team-name">Carregando…</span></li>
    </ul>
  </section>
</main>

<footer class="site-footer">
  <p>Hospital Regional de Itanhaém "Jorge Rossmann" — Itanhaém, SP</p>
</footer>

<script src="assets/site.js"></script>
<script>
  carregarManifesto()
    .then(itens => renderizarLista(itens, document.getElementById('lista-acervo')))
    .catch(() => {
      document.getElementById('lista-acervo').innerHTML =
        '<li class="team-row"><span class="team-name">Não foi possível carregar o acervo agora.</span></li>';
    });
</script>

</body>
</html>
