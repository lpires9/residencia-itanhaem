<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artigo — Acervo Itanhaém</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <a class="masthead-title" href="index.html">
      <img class="masthead-logo" src="assets/logo.svg" alt="Emblema HRJR" width="40" height="40">
      <span class="masthead-text">
        <span class="masthead-kicker">Hospital Regional de Itanhaém · Jorge Rossmann</span>
        <span class="masthead-name">Acervo Itanhaém</span>
      </span>
    </a>
    <nav class="masthead-nav">
      <a href="acervo.html" class="is-active">Acervo</a>
      <a href="utilitarios.html">Utilitários</a>
      <a href="datas.html">Datas</a>
      <a href="index.html#equipe">Equipe</a>
      <a href="index.html#sobre">Sobre</a>
    </nav>
  </div>
</header>

<main id="conteudo-artigo">
  <section class="section-head">
    <p class="section-note">Carregando artigo…</p>
  </section>
</main>

<footer class="site-footer">
  <p>Hospital Regional de Itanhaém "Jorge Rossmann" — Itanhaém, SP</p>
</footer>

<script src="assets/site.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const main = document.getElementById('conteudo-artigo');

  if (!id) {
    main.innerHTML = '<section class="section-head"><p class="section-note">Nenhum artigo indicado. Volte para o <a href="acervo.html">acervo</a>.</p></section>';
  } else {
    carregarArtigo(id).then(artigo => {
      document.title = `${artigo.titulo} — Acervo Itanhaém`;
      main.innerHTML = `
        <article class="article">
          <p class="hero-eyebrow">${artigo.area}</p>
          <h1>${artigo.titulo}</h1>
          <p class="article-meta">
            Resumo por ${artigo.autor_resumo} · publicado em ${formatarData(artigo.data_resumo)}
            · artigo original em ${formatarData(artigo.data_publicacao)}
          </p>
          <div class="article-body">
            ${artigo.resumo.map(p => `<p>${p}</p>`).join('')}
          </div>
          <p><a href="${artigo.fonte_url}" target="_blank" rel="noopener">Ler o artigo original — ${artigo.fonte_titulo}</a></p>
        </article>
        <section class="quiz-section">
          <h2>Questões</h2>
          <div class="quiz-player" id="quiz"></div>
        </section>
      `;
      iniciarQuiz(artigo.questoes, document.getElementById('quiz'));
    }).catch(() => {
      main.innerHTML = '<section class="section-head"><p class="section-note">Não foi possível carregar este artigo.</p></section>';
    });
  }
</script>

</body>
</html>
